# Code Review — 自动化代码审查流水线
#
# 静态检查 → 逻辑审查 → 安全审查 → 汇总报告
# 三步并行审查 + 一步汇总，全部基于内置的 code-reviewer Skill

name: code-review
version: 1.0.0
description: >
  Automated code review pipeline.
  Lint check → logic review → security review → summary report.

input_schema:
  repo_path:
    type: string
    required: true
    description: 代码仓库路径或 URL
  pr_diff:
    type: string
    required: false
    description: PR diff 内容（如不提供则审查整个仓库）

steps:
  # Step 1: 代码规范检查（无依赖）
  - id: lint-check
    skill: code-reviewer
    description: Check code style, naming conventions, and formatting issues
    input:
      mapping:
        focus: style and linting
        repo: $input.repo_path
        diff: $input.pr_diff

  # Step 2: 逻辑审查（无依赖，与 Step 1 并行）
  - id: logic-review
    skill: code-reviewer
    description: Review logic correctness, edge cases, and potential bugs
    input:
      mapping:
        focus: logic and correctness
        repo: $input.repo_path
        diff: $input.pr_diff

  # Step 3: 安全审查（无依赖，与 Step 1、2 并行）
  - id: security-review
    skill: code-reviewer
    description: Review security vulnerabilities, injection risks, and auth issues
    input:
      mapping:
        focus: security and vulnerabilities
        repo: $input.repo_path
        diff: $input.pr_diff

  # Step 4: 汇总报告（依赖所有三个审查）
  - id: summary
    skill: content-writer
    description: Combine all review findings into a clean summary report
    depends_on:
      - lint-check
      - logic-review
      - security-review
    input:
      mapping:
        lint_findings: $steps.lint-check.output
        logic_findings: $steps.logic-review.output
        security_findings: $steps.security-review.output

output:
  lint: $steps.lint-check.output
  logic: $steps.logic-review.output
  security: $steps.security-review.output
  summary: $steps.summary.output
