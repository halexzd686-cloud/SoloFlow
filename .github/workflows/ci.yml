name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (Ruff)
        run: uv run ruff check soloflow tests

      - name: Format check (Ruff)
        run: uv run ruff format --check soloflow tests

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test (install wheel in clean env)
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv dist/*.whl
          /tmp/smoke-venv/bin/sf --help > /dev/null
          /tmp/smoke-venv/bin/sf version
