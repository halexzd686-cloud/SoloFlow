name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (Ruff)
        run: uv run ruff check soloflow tests

      - name: Format check (Ruff)
        run: uv run ruff format --check soloflow tests

      - name: Test (pytest)
        run: uv run pytest -q --tb=short

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test (install wheel in clean env)
        run: |
          uv venv /tmp/smoke-venv
          uv pip install --python /tmp/smoke-venv dist/*.whl
          mkdir -p /tmp/soloflow-smoke-cwd
          cd /tmp/soloflow-smoke-cwd
          /tmp/smoke-venv/bin/sf --help > /dev/null
          /tmp/smoke-venv/bin/sf version
          /tmp/smoke-venv/bin/sf playbook show content-writer --json > /dev/null
          /tmp/smoke-venv/bin/sf skill show content-writer --json > /dev/null
          /tmp/smoke-venv/bin/sf agent show content-editor --json > /dev/null
          /tmp/smoke-venv/bin/sf flow show blog-pipeline > /dev/null
          /tmp/smoke-venv/bin/sf flow run blog-pipeline --dry-run -i topic=test > /dev/null
