[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soloflow"
# 版本单一来源: soloflow/__init__.py 的 __version__（hatch 动态读取）
dynamic = ["version"]
description = "文件驱动的 AI Skill 管理系统 —— 封装、复用、迭代你的 AI 技能"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
authors = [
    {name = "SoloFlow Contributors"}
]
keywords = ["ai", "llm", "skill", "prompt-engineering", "cli", "multi-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]

dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "litellm>=1.50",
    "httpx>=0.28",
    "textual>=8.0",
]

[project.urls]
Homepage = "https://github.com/halexzd686-cloud/SoloFlow"
Repository = "https://github.com/halexzd686-cloud/SoloFlow"
Issues = "https://github.com/halexzd686-cloud/SoloFlow/issues"
Changelog = "https://github.com/halexzd686-cloud/SoloFlow/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "ruff>=0.8",
]

[project.scripts]
soloflow = "soloflow.cli.main:app"
sf = "soloflow.cli.main:app"

[tool.hatch.version]
path = "soloflow/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["soloflow"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "soloflow/_bundled/skills"
"agents" = "soloflow/_bundled/agents"
"flows" = "soloflow/_bundled/flows"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Windows 系统 Temp 目录曾被损坏进程残留（pytest-of-86188 权限损坏），
# 用项目内 basetemp 避免依赖系统临时目录
addopts = ["-v", "--tb=short", "--basetemp=.pytest-tmp"]

[tool.hatch.metadata]
allow-direct-references = true
